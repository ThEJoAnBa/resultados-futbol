<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BATIISTV Resultados</title>

  <style>
    .team img {
    width: 32px;
    height: 32px;
    object-fit: contain;
    vertical-align: middle;
    margin: 0 8px;
  }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 6px;
      color: #bbb;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .date {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: bold;
    }

    .league-title {
  background: #168c45;
  color: white;
  padding: 12px 16px;
  font-weight: bold;
  cursor: pointer;
}

    .league-title {
      background: #168c45;
      color: white;
      padding: 12px 16px;
      font-weight: bold;
    }

    .match {
  display: grid;
  grid-template-columns: 1fr 90px 1fr;
  align-items: center;
  gap: 15px;
  padding: 20px;
  background: #fff;
  border-bottom: 1px solid #eee;
  min-height: 90px;
}

.team {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: bold;
}

.team.home {
  justify-content: flex-end;
  text-align: right;
}

.team.away {
  justify-content: flex-start;
  text-align: left;
}

.team img {
  width: 38px;
  height: 38px;
  object-fit: contain;
}
.score {
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  min-width: 70px;
  line-height: 1.2;
  white-space: nowrap;
}

.score .status {
  display: block;
  margin-top: 6px;
  font-size: 10px;
  font-weight: 600;
  color: #777;
  text-transform: uppercase;
}

.status {
  display: block;
  margin-top: 5px;
  font-size: 11px;
  font-weight: normal;
  color: #777;
}

    .match:last-child {
      border-bottom: none;
    }

    .home {
      text-align: right;
    }

    .away {
      text-align: left;
    }

    .score {
      width: 20%;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      display: block;
      font-size: 12px;
      color: #777;
      margin-top: 4px;
    }

    .empty {
      text-align: center;
      background: white;
      padding: 40px 20px;
      border-radius: 12px;
      color: #666;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>BATIISTV</h1>
    <p>Resultados de fútbol</p>
  </header>

  <main class="container">

<div class="date-buttons">
  <button onclick="cambiarFecha(-1)">Ayer</button>
  <button onclick="cambiarFecha(0)">Hoy</button>
  <button onclick="cambiarFecha(1)">Mañana</button>
</div>
  
<div class="date">
      Partidos de hoy
    </div>

    <div class="league">

      <div class="league-title">
        Ejemplo de competición
      </div>

      <div class="match">
        <div class="team home">
          Equipo Local
        </div>

        <div class="score">
          2 - 1
          <span class="status">Finalizado</span>
        </div>

        <div class="team away">
          Equipo Visitante
        </div>
      </div>

    </div>

    <div class="empty">
      Los resultados reales aparecerán aquí cuando conectemos la API de fútbol.
    </div>

  </main>

  <footer>
    BATIISTV · Resultados de fútbol
  </footer>
<script>

let fechaSeleccionada = new Date().toISOString().split("T")[0];  
  function cambiarFecha(dias) {
  const fecha = new Date();

  fecha.setDate(fecha.getDate() + dias);

  fechaSeleccionada = fecha.toISOString().split("T")[0];

  cargarPartidos();
}
async function abrirCompeticion(idLiga) {
  try {
    const respuesta = await fetch(`/api/league?league=${idLiga}`);
    const datos = await respuesta.json();

    if (!respuesta.ok) {
      throw new Error(datos.error || "Error al cargar la competición");
    }

    console.log("Clasificación:", datos);

  } catch (error) {
    console.error(error);
  }
}
  async function cargarPartidos() {
  const contenedor = document.querySelector(".container");

  try {
    const respuesta = await fetch(`/api/football?date=${fechaSeleccionada}`);
    const datos = await respuesta.json();

    if (!respuesta.ok) {
      throw new Error(datos.error || "Error al cargar los partidos");
    }

    const partidos = datos.response || [];
const partidosFiltrados = partidos.filter(partido => {
  if (partido.league.name === "Premier League") {
    return partido.league.country === "England";
  }

  if (partido.league.name === "Bundesliga") {
    return partido.league.country === "Germany";
  }

  return true;
});
    // Eliminamos los ejemplos
    document.querySelectorAll(".league").forEach(el => el.remove());
    document.querySelector(".empty")?.remove();

    if (partidos.length === 0) {
      contenedor.insertAdjacentHTML(
        "beforeend",
        '<div class="empty">No hay partidos programados para hoy.</div>'
      );
      return;
    }

    const ligas = {};

partidosFiltrados.forEach(partido => {
  const ligaId = partido.league.id;
  const ligaNombre = partido.league.name;
  const clave = `${ligaId}-${ligaNombre}`;

  if (!ligas[clave]) {
    ligas[clave] = {
      id: ligaId,
      nombre: ligaNombre,
      pais: partido.league.country,
      partidos: []
    };
  }

  ligas[clave].partidos.push(partido);
});
const prioridades = [
  "UEFA Champions League",
  "Premier League",
  "La Liga",
  "Serie A",
  "Bundesliga",
  "Ligue 1",
  "UEFA Europa League",
  "UEFA Europa Conference League",
  "Brasileirão Série A",
  "Liga Profesional Argentina",
  "Primera División - Chile",
  "Liga 1 - Peru",
  "Primera A",
  "Primera División - Uruguay",
  "Primera División - Paraguay",
  "LigaPro Serie A",
  "Primera División - Bolivia"
];

const ligasOrdenadas = Object.values(ligas).sort((a, b) => {
  const prioridadA = prioridades.indexOf(a.nombre);
  const prioridadB = prioridades.indexOf(b.nombre);

  const valorA = prioridadA === -1 ? 999 : prioridadA;
  const valorB = prioridadB === -1 ? 999 : prioridadB;

  return valorA - valorB;
});
    ligasOrdenadas.forEach(liga => {
      const bloque = document.createElement("div");
      bloque.className = "league";

      bloque.innerHTML = `
  <div class="league-title" onclick="abrirCompeticion(${liga.partidos[0].league.id})">
    ${liga.nombre}
  </div>
`;
      liga.partidos.forEach(partido => {
        const estado = partido.fixture.status.short;

let textoEstado = "Próximo";

if (["FT", "AET", "PEN"].includes(estado)) {
  textoEstado = "Finalizado";
} else if (["1H", "2H", "ET", "P"].includes(estado)) {
  textoEstado = "EN DIRECTO";
}

let marcador;

if (estado === "NS" || (partido.goals.home === null && partido.goals.away === null)) {
  const fechaPartido = new Date(partido.fixture.date);

  marcador = fechaPartido.toLocaleTimeString("es-ES", {
    hour: "2-digit",
    minute: "2-digit"
  });
} else {
  const golesLocal = partido.goals.home ?? 0;
  const golesVisitante = partido.goals.away ?? 0;

  marcador = `${golesLocal} - ${golesVisitante}`;
}
const partidoHTML = document.createElement("div");
partidoHTML.className = "match";
    partidoHTML.innerHTML = `
  <div class="team home">
    <img src="${partido.teams.home.logo}" alt="${partido.teams.home.name}">
    <span>${partido.teams.home.name}</span>
  </div>

  <div class="score">
  ${marcador}
  <span class="status">${textoEstado}</span>
</div>

  <div class="team away">
    <img src="${partido.teams.away.logo}" alt="${partido.teams.away.name}">
    <span>${partido.teams.away.name}</span>
  </div>
`;

        bloque.appendChild(partidoHTML);
      });

      contenedor.appendChild(bloque);
    });

  } catch (error) {
    console.error(error);

    document.querySelectorAll(".league").forEach(el => el.remove());
    document.querySelector(".empty")?.remove();

    contenedor.insertAdjacentHTML(
      "beforeend",
      `<div class="empty">No se pudieron cargar los resultados.</div>`
    );
  }
}

cargarPartidos();
</script>
</body>
</html>
